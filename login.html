<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign in - La Posta</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="welcome-header">

        <h1>LA POSTA</h1>

        <p>Hablá. Compartí. Conectá.</p>

    </header>


    <main class="welcome">

        <section class="welcome-card">

            <h2>Iniciar sesión</h2>

            <p>
                Entrá a tu cuenta de La Posta.
            </p>


            <form>

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="tu@email.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Tu contraseña"
                        required
                    >

                </div>


                <button type="submit" class="button primary">
                    SIGN IN
                </button>

            </form>


            <p class="form-link">
                ¿Todavía no tenés una cuenta?
                <a href="registro.html">Crear cuenta</a>
            </p>


            <a href="index.html" class="back-link">
                ← Volver a La Posta
            </a>

        </section>

    </main>


    <footer>

        <p>© 2026 La Posta</p>

    </footer>

</body>

</html>
