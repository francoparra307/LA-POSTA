<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign up - La Posta</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="welcome-header">

        <h1>LA POSTA</h1>

        <p>Hablá. Compartí. Conectá.</p>

    </header>


    <main class="welcome">

        <section class="welcome-card">

            <h2>Crear cuenta</h2>

            <p>
                Sumate a La Posta y empezá a participar.
            </p>


            <form>

                <div class="form-group">

                    <label for="username">
                        Nombre de usuario
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Elegí tu nombre de usuario"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="tu@email.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Creá una contraseña"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password-confirm">
                        Repetir contraseña
                    </label>

                    <input
                        type="password"
                        id="password-confirm"
                        name="password-confirm"
                        placeholder="Repetí tu contraseña"
                        required
                    >

                </div>


                <button type="submit" class="button primary">
                    SIGN UP
                </button>

            </form>


            <p class="form-link">
                ¿Ya tenés una cuenta?
                <a href="login.html">Iniciar sesión</a>
            </p>


            <a href="index.html" class="back-link">
                ← Volver a La Posta
            </a>

        </section>

    </main>


    <footer>

        <p>© 2026 La Posta</p>

    </footer>

</body>

</html>
